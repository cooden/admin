<!DOCTYPE html>

  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .home-hero { text-align: center; padding: 60px 20px 40px; }
    .home-hero h1 { font-size: 2.4rem; margin-bottom: 12px; }
    .home-hero p { color: #666; font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
    .site-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin: 40px 0; }
    .site-card { display: block; padding: 28px; border-radius: 12px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.06); text-decoration: none; color: inherit; transition: transform .2s, box-shadow .2s; }

    .site-card h3 { font-size: 1.25rem; margin-bottom: 8px; color: #1a1a1a; }
    .site-card p { color: #666; font-size: .95rem; line-height: 1.6; }
    .site-card .tag { display: inline-block; margin-top: 12px; padding: 4px 12px; background: #eef2ff; color: #4f46e5; border-radius: 20px; font-size: .8rem; }
