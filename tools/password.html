<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成器 - 在线生成高强度随机密码 | 实用工具箱</title>
  <meta name="description" content="在线密码生成器，自定义长度、数字、大小写字母、符号组合，使用 crypto 安全随机数生成高强度密码，本地生成不上传。">
  <meta name="keywords" content="密码生成器,随机密码,高强度密码,密码工具,安全密码">
  <link rel="canonical" href="https://your-domain.com/tools/password.html">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<main class="main">
  <div class="container">
    <div class="tool-page">
      <div class="tool-content">
        <h1>🔐 密码生成器</h1>
        <p class="lead">自定义长度和字符组合，生成高强度随机密码。所有密码本地生成，不上传服务器。</p>

        <div class="form-group">
          <label>密码长度：<strong id="len-display">16</strong> 位</label>
          <input type="range" id="length" min="4" max="64" value="16" oninput="document.getElementById('len-display').textContent=this.value;Pwd.gen()">
        </div>

        <div class="form-group">
          <label>字符类型</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" id="upper" checked onchange="Pwd.gen()"> 大写 A-Z</label>
            <label class="checkbox-item"><input type="checkbox" id="lower" checked onchange="Pwd.gen()"> 小写 a-z</label>
            <label class="checkbox-item"><input type="checkbox" id="number" checked onchange="Pwd.gen()"> 数字 0-9</label>
            <label class="checkbox-item"><input type="checkbox" id="symbol" checked onchange="Pwd.gen()"> 符号 !@#$%</label>
          </div>
        </div>

        <div class="form-group">
          <label>排除易混淆字符 (0/O/l/1/I)</label>
          <label class="checkbox-item" style="display:inline-flex"><input type="checkbox" id="exclude" onchange="Pwd.gen()"> 排除</label>
        </div>

        <button class="btn btn-primary btn-large" style="background:var(--primary);color:#fff;width:100%;margin-bottom:16px" onclick="Pwd.gen()">🔄 重新生成</button>

        <div class="output-box" id="pwd-output">
          <button class="copy-btn" onclick="App.copy(document.getElementById('pwd-text').textContent)">复制</button>
          <span id="pwd-text"></span>
        </div>

        <div style="margin-top:16px;padding:12px 16px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;font-size:0.9rem;color:#166534" id="strength-info"></div>

        <div id="ad-mid" style="margin-top:24px"></div>

        <h2 style="font-size:1.2rem;margin-top:32px;margin-bottom:12px">如何选择安全的密码</h2>
        <p style="color:var(--text-muted);line-height:1.8;margin-bottom:12px">
          一个安全的密码应满足以下条件：长度至少 12 位，包含大小写字母、数字和符号；
          避免使用生日、电话、姓名等可被猜到的信息；不同网站使用不同密码。本工具使用
          Web Crypto API 的 <code>crypto.getRandomValues</code> 生成密码学安全随机数，
          比普通 Math.random 更安全。
        </p>
      </div>

      <aside class="sidebar">
        <div class="sidebar-widget">
          <h3>其他工具</h3>
          <ul>
            <li><a href="unit-converter.html">📐 单位转换器</a></li>
            <li><a href="bmi.html">⚖️ BMI 计算器</a></li>
            <li><a href="qrcode.html">📱 二维码生成</a></li>
            <li><a href="color-picker.html">🎨 颜色选择器</a></li>
            <li><a href="word-count.html">📝 字数统计</a></li>
          </ul>
        </div>
        <div class="sidebar-widget" id="ad-side"></div>
      </aside>
    </div>
  </div>
</main>

<script src="../assets/js/tracker.js?v=2" data-site="tools"></script>
<script src="../assets/js/common.js?v=2"></script>
<script>
var Pwd = {
  pools: {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    number: '0123456789',
    symbol: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  },
  confusing: '0Ol1I',

  gen: function () {
    var len = +document.getElementById('length').value;
    var pool = '';
    var types = [];
    if (document.getElementById('upper').checked) { pool += this.pools.upper; types.push('upper'); }
    if (document.getElementById('lower').checked) { pool += this.pools.lower; types.push('lower'); }
    if (document.getElementById('number').checked) { pool += this.pools.number; types.push('number'); }
    if (document.getElementById('symbol').checked) { pool += this.pools.symbol; types.push('symbol'); }
    if (document.getElementById('exclude').checked) {
      pool = pool.split('').filter(function (c) { return this.confusing.indexOf(c) === -1; }, this).join('');
    }
    if (!pool) { document.getElementById('pwd-text').textContent = '请至少选择一种字符类型'; return; }

    // 每类至少一个字符
    var pwd = types.map(function (t) {
      var p = this.pools[t];
      if (document.getElementById('exclude').checked) {
        p = p.split('').filter(function (c) { return this.confusing.indexOf(c) === -1; }, this).join('');
      }
      return p[Math.floor(this.secureRandom() * p.length)];
    }, this).join('');

    while (pwd.length < len) {
      pwd += pool[Math.floor(this.secureRandom() * pool.length)];
    }
    // 打乱顺序
    pwd = pwd.split('').sort(function () { return this.secureRandom() - 0.5; }, this).join('').slice(0, len);
    // 确保长度（避免 sort 后不足）
    while (pwd.length < len) pwd += pool[Math.floor(this.secureRandom() * pool.length)];

    document.getElementById('pwd-text').textContent = pwd;
    this.checkStrength(pwd);
  },

  secureRandom: function () {
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint32Array(1); crypto.getRandomValues(a);
      return a[0] / 4294967296;
    }
    return Math.random();
  },

  checkStrength: function (pwd) {
    var score = 0;
    if (pwd.length >= 12) score += 2; else if (pwd.length >= 8) score += 1;
    if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score += 1;
    if (/\d/.test(pwd)) score += 1;
    if (/[^a-zA-Z0-9]/.test(pwd)) score += 2;
    var labels = ['很弱', '弱', '一般', '强', '很强', '极强'];
    var colors = ['#fee2e2', '#fed7aa', '#fef3c7', '#d1fae5', '#a7f3d0', '#6ee7b7'];
    var i = Math.min(score, 5);
    document.getElementById('strength-info').innerHTML =
      '密码强度：<strong style="color:' + ['#dc2626','#ea580c','#d97706','#059669','#059669','#047857'][i] + '">' + labels[i] + '</strong>' +
      ' （长度 ' + pwd.length + ' 位，' + (score >= 4 ? '建议使用' : '建议增加长度或字符类型') + '）';
  }
};

App.mount({
  site: 'tools',
  brand: '实用工具箱',
  brandIcon: '🛠️',
  nav: [
    { label: '首页', href: 'index.html' },
    { label: '单位转换', href: 'unit-converter.html' },
    { label: 'BMI', href: 'bmi.html' },
    { label: '密码生成', href: 'password.html' },
    { label: '二维码', href: 'qrcode.html' }
  ],
  footer: { tools: [], articles: [] }
});

Pwd.gen();
document.getElementById('ad-mid').appendChild(App.ad('rectangle'));
document.getElementById('ad-side').appendChild(App.ad('sidebar'));
MTA.track('view_tool', { tool: 'password' });
</script>

</body>
</html>
