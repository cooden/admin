  start: function () {
    this.qIndex = 0;
    this.scores = {};
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('question-screen').style.display = '';
    this.showQ();
    MTA.track('start_test', { test: 'animal' });
  },

  showQ: function () {
    var q = this.questions[this.qIndex];
    var pct = (this.qIndex / this.questions.length) * 100;
    document.getElementById('prog-bar').style.width = pct + '%';
    document.getElementById('prog-text').textContent = '第 ' + (this.qIndex + 1) + ' / ' + this.questions.length + ' 题';
    document.getElementById('q-num').textContent = 'Question ' + (this.qIndex + 1);
    document.getElementById('q-text').textContent = q.q;
    var opts = q.options.map(function (o, i) {
      return '<div class="option" onclick="Quiz.answer(\'' + o.t + '\')"><span class="letter">' + 'ABCD'[i] + '</span>' + o.text.slice(3) + '</div>';
    }).join('');
    document.getElementById('options').innerHTML = opts;
  },

  answer: function (type) {
    this.scores[type] = (this.scores[type] || 0) + 1;
    this.qIndex++;
    if (this.qIndex < this.questions.length) {
      this.showQ();
    } else {
      this.showResult();
    }
  },

  showResult: function () {
    document.getElementById('prog-bar').style.width = '100%';
    document.getElementById('prog-text').textContent = '✨ 揭晓答案！';
    // 找最高分
    var max = 0, win = 'fox';
    for (var t in this.scores) {
      if (this.scores[t] > max) { max = this.scores[t]; win = t; }
    }
    var r = this.results[win];
    document.getElementById('question-screen').style.display = 'none';
    var result = document.getElementById('result-screen');
    result.style.display = '';
    result.innerHTML = '<div class="result-card">' +
