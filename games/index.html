  <style>
    body { background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); color: #fff; }
    .game-hero { text-align: center; padding: 50px 20px 30px; }
    .game-hero h1 { font-size: 2.6rem; margin-bottom: 12px; background: linear-gradient(90deg,#f9d423,#ff4e50); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .game-hero p { opacity: .85; font-size: 1.1rem; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin: 30px 0; }
    .game-card { display: block; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; overflow: hidden; text-decoration: none; color: #fff; transition: all .25s; backdrop-filter: blur(10px); }
    .game-card:hover { transform: translateY(-6px); border-color: rgba(249,212,35,.4); box-shadow: 0 20px 40px rgba(0,0,0,.3); }
    .game-thumb { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 4rem; background: linear-gradient(135deg, #2d1b69, #11998e); position: relative; }
    .game-thumb::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 30px 30px; }
    .game-info { padding: 20px; }
    .game-info h3 { margin: 0 0 8px; font-size: 1.2rem; color: #f9d423; }
    .game-info p { margin: 0; opacity: .75; font-size: .9rem; line-height: 1.6; }
    .game-meta { margin-top: 12px; display: flex; gap: 10px; font-size: .8rem; opacity: .6; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: rgba(249,212,35,.15); color: #f9d423; }
    .vip-badge { background: linear-gradient(135deg,#f9d423,#ff4e50); color: #2d1b69; font-weight: 700; }
  </style>
</head>

          <div class="game-meta"><span>Coming Soon</span></div>
        </div>
      </div>
    </div>

    <div id="ad-bottom"></div>
  </div>
</main>

<script src="../assets/js/tracker.js?v=2" data-site="games"></script>

</html>
